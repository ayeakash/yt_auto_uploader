name: YouTube Auto-Uploader

on:
  schedule:
    # Runs once daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual triggering from GitHub UI with custom channel or flags
    inputs:
      channel:
        description: 'Specific Channel ID (leave empty for all)'
        required: false
        default: ''
      max_videos:
        description: 'Max videos per channel'
        required: false
        default: '20'

jobs:
  auto-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run YouTube Auto-Uploader Pipeline
        env:
          BB_USERNAME: ${{ secrets.BB_USERNAME }}
          BB_PASSWORD: ${{ secrets.BB_PASSWORD }}
        run: |
          CMD="python main.py --headless"
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            CMD="$CMD --channel ${{ github.event.inputs.channel }}"
          fi
          if [ -n "${{ github.event.inputs.max_videos }}" ]; then
            CMD="$CMD --max-videos ${{ github.event.inputs.max_videos }}"
          fi
          echo "Running command: $CMD"
          eval $CMD

      - name: Commit Updated Registries (Deduplication State)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add registries/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update video registries [skip ci]" && git push)
